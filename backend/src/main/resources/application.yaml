spring:
  application:
    name: url_monitor
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
server:
  port: 5000
jwt:
  secret: ${JWT_SECRET} #1234567890123456789012345678901234567890123456789012345678901234